machines:
  x220:
    heartbeat: # Absturz-Forensik, Cron per run_onchange_after_53; nur x220 mit Alarm+Hibernate
      top: true
      alarm: true
      hibernate: true
      log: "Sync/vault/SECOND_BRAIN/x220-forensics-unplanned-restart/x220_heartbeat.log" # relativ zu $HOME
    sysvinit: true # bootet mit sysvinit statt systemd, siehe run_onchange_after_51-install-wlan-monitor-init.sh.tmpl
    # Syncthing: autostart = @reboot-Cron (run_onchange_after_76); die uebrigen
    # Werte setzt run_after_56 per REST. Feste Peer-Adressen (IPs!) stehen nicht
    # hier, sondern in ~/Sync/vault/syncthing/<host>/peers.
    syncthing:
      autostart: true
      localDiscovery: true
      globalDiscovery: false # Handy erreicht den x220 ueber seine WG-Adresse
      relays: false
      nat: false
    tmux:
      statusBg: "colour214 #dark orange"
      # Generischer Default (oeffentlicher Mirror!) - echte Kunden-/Heimnetz-
      # Ziele stehen NICHT hier, sondern in ~/Sync/vault/tmux/x220/
      # resurrect-processes, siehe dot_config/tmux/tmux.conf.tmpl.
      resurrectProcesses: 'btop "journalctl -f" "gping -n 0.9 1.1.1.1 google.de"'
  x230:
    heartbeat:
      top: true
    syncthing: # siehe x220
      autostart: true
      localDiscovery: true
      globalDiscovery: false
      relays: false
      nat: false
    tmux:
      statusBg: "silver"
      # Generischer Default (oeffentlicher Mirror!) - echte Kunden-/Heimnetz-
      # Ziele stehen NICHT hier, sondern in ~/Sync/vault/tmux/x230/
      # resurrect-processes, siehe dot_config/tmux/tmux.conf.tmpl.
      resurrectProcesses: 'nvim btop "gping -n 0.8 1.1.1.1 google.de" "mtr google.de" "./check_connection.sh"'
  t410s:
    heartbeat:
      top: true
    syncthing: # siehe x220
      autostart: true
      localDiscovery: true
      globalDiscovery: false
      relays: false
      nat: false
    tmux:
      statusBg: "colour33"
      # Generischer Default (oeffentlicher Mirror!) - echte Ziele stehen NICHT
      # hier, sondern in ~/Sync/vault/tmux/t410s/resurrect-processes, siehe
      # dot_config/tmux/tmux.conf.tmpl.
      resurrectProcesses: 'btop'
  ihht:
    heartbeat:
      top: false # Leicht-Modus bis Kosten gemessen (aelteste Hardware, Centrino 2)
    syncthing: # siehe x220; Kiosk nur ueber WireGuard, nichts im Netz suchen
      autostart: true
      localDiscovery: false
      globalDiscovery: false
      relays: false
      nat: false
    wireguard: true # Tunnel als NM-Profil mit autoconnect, siehe run_after_47-configure-wireguard-nm-profile.sh.tmpl (README: Entscheidung 16.10.2026)
    tmux:
      statusBg: "colour141 #flieder"
      # Generischer Default (oeffentlicher Mirror!) - echte Ziele stehen NICHT
      # hier, sondern in ~/Sync/vault/tmux/ihht/resurrect-processes, siehe
      # dot_config/tmux/tmux.conf.tmpl.
      resurrectProcesses: 'btop'
  praxis-eiffel:
    heartbeat:
      top: true
    syncthing: # wie ihht: nur ueber WireGuard, nichts im Netz suchen
      autostart: true
      localDiscovery: false
      # Ausnahme zur Erstkopplung: an, solange noch kein Geraet verbunden ist,
      # danach gilt localDiscovery (false). Siehe Skript 56 und README.
      localDiscoveryUntilPaired: true
      globalDiscovery: false
      relays: false
      nat: false
      # Vault-Whitelist: nur diese Unterordner kommen per Syncthing auf den Host
      # (alles andere steht im ~/Sync/vault/.stignore als "ignorieren"). Format:
      # Ordner: [Unterordner], leere Liste = ganzer Ordner. Ohne vaultInclude
      # wird keine .stignore angelegt (Vault komplett). Siehe README.
      vaultInclude:
        script: [common, praxis-eiffel]
        ssh: [common, praxis-eiffel]
        tmux: [praxis-eiffel]
        syncthing: [praxis-eiffel]
        wireguard: [praxis-eiffel]
        tealdeer: []
    wireguard: true # NM-Profil mit autoconnect
    wireguardName: eiffel-praxmon # Interface max. 15 Zeichen; Datei /etc/wireguard/eiffel-praxmon.conf
    tmux:
      statusBg: "colour141 #flieder" # gleiche Farbe wie ihht (bewusst)
      # Generischer Default (oeffentlicher Mirror!) - echte Ziele stehen NICHT
      # hier, sondern in ~/Sync/vault/tmux/praxis-eiffel/resurrect-processes.
      resurrectProcesses: 'btop'

# Gepinnte Direkt-Downloads (kein apt/brew-Paket). Der Preflight
# (run_once_before_02) prüft jeden Eintrag per HEAD, bevor die langen
# Skripte starten. Derzeit leer: NoMachine kommt als 9.x-.deb aus dem
# Vault (run_after_35), weil 10.x lizenzpflichtig ist.
downloads: {}
