# Barrier-Server-Config fuer x230 (portables Geraet, Tastatur/Maus-Quelle).
# Aktiv erst mit  useExternalConfig=true  in ~/.config/Debauchee/Barrier.conf.
# Der GUI-Layout-Editor ist dann abgeschaltet; Aenderungen nur noch hier.
# Live nachladen ohne Client-Abbruch:  kill -HUP $(pgrep -x barriers)
#
# Nur x230 nutzt diese Datei (Barrier-Server); auf allen anderen Maschinen
# per .chezmoiignore ausgeblendet. x230 hat derzeit weder chezmoi noch den
# Vault-Share - dort wird die Datei von Hand deployt, siehe
# SECOND_BRAIN/deskflow-barrier-rollentausch/BERICHT_deskflow-barrier-rollentausch.md

section: screens
	harrys-x230:
	oben:
end

section: aliases
	# Nur EIN oberer Bildschirm-Slot. Wer gerade verbunden ist (Labor: x220,
	# Zuhause: kartoffelcomputer), liegt oben. Keine Netz-Erkennung noetig.
	oben:
		x220
		harrys-x220
		kartoffelcomputer
end

section: links
	harrys-x230:
		up = oben
	oben:
		down = harrys-x230
end

section: options
	heartbeat = 5000
	relativeMouseMoves = false
	clipboardSharing = true
	switchDelay = 500
	switchCorners = none
	switchCornerSize = 0
	# Panik-Taste: Cursor zurueck auf das x230. Idempotent (anders als das
	# bisherige toggleScreen, das bei bereits-daheim wieder hinauswirft).
	keystroke(Control+<) = switchToScreen(harrys-x230)
end
