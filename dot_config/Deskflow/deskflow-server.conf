# Deskflow-Server-Config fuer x220 (Labor-Standrechner).
# Verwaltet von Hand / chezmoi, NICHT ueber den GUI-Editor
# (Deskflow.conf: [server] externalConfig=true schaltet den GUI-Editor ab).
#
# x220 ist normalerweise Client von x230. Server wird x220 nur im
# Rollentausch ("ich nehme fuer eine Stunde das x220 in die Hand"), siehe
# ~/.local/bin/kvm-rolle.  Dann sitzt das x230 oben.

section: screens
	x220:
	oben:
end

section: aliases
	# Nur ein oberer Bildschirm-Slot. Im Rollentausch-Szenario ist die
	# Gegenseite immer das x230.
	oben:
		harrys-x230
end

section: links
	x220:
		up = oben
	oben:
		down = x220
end

section: options
	protocol = barrier
	relativeMouseMoves = false
	clipboardSharing = true
	clipboardSharingSize = 3072
	switchDelay = 500
	switchCorners = none
	switchCornerSize = 0
	# Panik-Taste: Cursor zurueck auf das x220 (den Server). Idempotent -
	# anders als toggleScreen wirft es nicht wieder hinaus, wenn man
	# schon daheim ist. toggleScreen kennt Deskflow 1.22 ohnehin nicht.
	keystroke(Control+<) = switchToScreen(x220)
end
