  command = 'echo "⚠ db:migrate!"'                                                                                                                                                                                                                                       
  when = 'grep -q "^\- \[x\]" /home/harry/Projekte/code/speech_therapy_manager/MDFILES.d/PROMPT_TODO.md 2>/dev/null'                                                                                                                                                     
