"$schema" = 'https://starship.rs/config-schema.json'

format = """\
$all\
${custom.db_migrate}$fill$ruby$custom\
$line_break\
$jobs$character"""

[directory]
truncation_length = 4
read_only = " 󰌾"

# Path substitutions for shorter display
[directory.substitutions]
"~/Developer/projects" = "DEV"
"~/Documents/work" = "WORK"
"~/.config" = "CFG"

