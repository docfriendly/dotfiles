  format = "[$output]($style) "

# Warnt, wenn harry auf diesem Host Mitglied einer der überwachten
# privilegierten Gruppen ist (adm/disk/docker - de-facto root-Äquivalent bzw.
# sudo-freier Log-/Systemzugriff). "sudo" bewusst NICHT dabei: das ist für
# harry normal/gewollt, würde als Dauerzustand die eigentlichen Ausreißer nur
# übertönen. Wird von `forensic-mode` gesetzt; unbedingt mit
# `forensic-mode off <gruppe>` wieder entfernen.
[custom.privgroups]
description = "Warnung vor privilegierten Gruppenmitgliedschaften"
command = '''
groups=" $(id -nG) "
out=""
for g in adm disk docker; do
  case "$groups" in *" $g "*) out="$out $g" ;; esac
done
echo "${out# }"
'''
when = '''
groups=" $(id -nG) "
for g in adm disk docker; do
  case "$groups" in *" $g "*) exit 0 ;; esac
done
exit 1
'''
symbol = "🛡"
style = "bold fg:red"
format = "[$symbol $output]($style) "
shell = ["bash", "--noprofile", "--norc"]

# Zeigt, ob das sudo-Timestamp-Cache voraussichtlich noch "warm" ist
# (nächster sudo-Aufruf würde vermutlich nicht nach dem Passwort fragen).
# Fragt sudo dafür NICHT selbst ab (das würde das Fenster durch den Check
# selbst verlängern) - stattdessen Heuristik über die Marker-Datei aus dem
# _track_sudo_use-Hook in .bashrc (nur gesetzt, wenn "sudo" tatsächlich
# getippt wurde) gegen einen angenommenen 15-min-Timeout (sudo-Default;
# bei abweichendem timestamp_timeout in /etc/sudoers hier die 900 anpassen).
[custom.sudo_cache]
description = "sudo-Timestamp-Cache voraussichtlich warm? (Heuristik, 15 min)"
command = "echo 🔓"
when = '''
f="$HOME/.cache/sudo-last-used"
[ -f "$f" ] && [ "$(( $(date +%s) - $(stat -c %Y "$f") ))" -lt 900 ]
'''
format = "[$output]($style) "
style = "bold fg:yellow"
shell = ["bash", "--noprofile", "--norc"]

[custom.ssh_no_keys]
description = "SSH missing keys"
when = "ssh-add -l | grep -q 'no identities'"
command = "echo 🚫"
format = "$symbol[$output]($style) "
shell = ["bash", "--noprofile", "--norc"]
symbol = "󱕵 "
style = "bold fg:red"

[custom.ssh_keys]
description = "SSH key count"
when = "ssh-add -l | grep -v -q 'no identities'"
command = "ssh-add -l | grep -v 'no identities' | wc -l"
format = "$symbol[$output]($style) "
shell = ["bash", "--noprofile", "--norc"]
symbol = "󱕵 "
style = "bold fg:green"

# Custom module to show tmux session in prompt
[custom.tmux_session]
command = "tmux display-message -p '#S' 2>/dev/null"
when = "test -n $TMUX"
format = "[ $output](bold yellow) "
shell = ["bash", "--noprofile", "--norc"]

# Shows "CHEZMOI" while inside a `chezmoi cd` subshell
[custom.chezmoi]
description = "Inside a chezmoi cd subshell"
command = "echo CHEZMOI"
when = 'test -n "$CHEZMOI"'
format = "[ $output]($style) "
shell = ["bash", "--noprofile", "--norc"]
style = "bold fg:magenta"

# Shell nesting depth (subshells, sudo -s, chezmoi cd, ...) - tmux-bereinigt:
# SSH/mosh + tmux ist der Normalfall (SHLVL=2) und bleibt stumm; nur wenn
# innerhalb von tmux zusätzlich genestet wird (>=3) oder außerhalb von tmux
# schon ab Level 2 genestet wird, wird angezeigt.
[custom.shlvl]
description = "Shell nesting depth, tmux-bereinigt"
command = 'echo $SHLVL'
when = '''
if [ -n "$TMUX" ]; then
  [ "$SHLVL" -ge 3 ]
else
  [ "$SHLVL" -ge 2 ]
fi
'''
symbol = "⇊ "
style = "bold yellow"
format = "$symbol[$output]($style) "
shell = ["bash", "--noprofile", "--norc"]
