# Warnt, wenn harry auf diesem Host Mitglied einer der überwachten
# privilegierten Gruppen ist (adm/disk/docker - de-facto root-Äquivalent bzw.
# sudo-freier Log-/Systemzugriff). "sudo" bewusst NICHT dabei: das ist für
# harry normal/gewollt, würde als Dauerzustand die eigentlichen Ausreißer nur
# übertönen. Wird von `forensic-mode` gesetzt; unbedingt mit
# `forensic-mode off <gruppe>` wieder entfernen.
#
# Bewusst NICHT `id -nG`/`groups`: die Zusatzgruppen eines Prozesses werden
# einmalig beim Login gesetzt (initgroups()) und nie aus /etc/group neu
# eingelesen. In einer bereits laufenden Shell - v.a. in einem seit längerem
# laufenden tmux-Server, dessen Panes alle vom selben alten Server-Prozess
# geforkt werden - bleibt `id -nG` daher beliebig lange auf dem Stand von vor
# dem letzten Login stehen, selbst wenn `forensic-mode` die Gruppe längst
# geändert hat (siehe BERICHT/Chat vom 26.08.2026). `getent group $g` liest
# stattdessen live aus /etc/group (bzw. NSS/LDAP/sssd falls konfiguriert) und
# reagiert deshalb sofort auf jede Änderung, auch in alten tmux-Sessions -
# genau das will dieses Modul: so wenig Zeit wie möglich unbemerkt in einer
# prekären Gruppe verbringen. Deckt nur sekundäre (Zusatz-)Gruppenmitglied-
# schaft ab; dass adm/disk/docker mal die Primärgruppe eines Users sind, ist
# praktisch nie der Fall und wird hier bewusst nicht extra geprüft.
[custom.privgroups]
description = "Warnung vor privilegierten Gruppenmitgliedschaften (live aus /etc/group via getent, nicht aus den ggf. veralteten Prozess-Credentials)"
command = '''
out=""
for g in adm disk docker; do
  case ",$(getent group "$g" | cut -d: -f4)," in *",harry,"*) out="$out $g" ;; esac
done
echo "${out# }"
'''
when = '''
for g in adm disk docker; do
  case ",$(getent group "$g" | cut -d: -f4)," in *",harry,"*) exit 0 ;; esac
done
exit 1
'''
symbol = "🛡"
style = "bold fg:red"
format = "[$symbol $output]($style) "
shell = ["bash", "--noprofile", "--norc"]

# Zeigt, ob das sudo-Timestamp-Cache aktuell warm ist (nächster sudo-Aufruf
# würde nicht nach dem Passwort fragen). Das "ob" kommt jetzt von sudo selbst
# (`sudo -Nnv`, ground truth statt Heuristik: respektiert tty_tickets/echten
# timestamp_timeout automatisch) - -N/--no-update verlängert das Fenster
# dabei NICHT (bestätigt: sudo 1.9.16p2, siehe `man sudo`). Die "~Xm"-Angabe
# bleibt Heuristik über die Marker-Datei aus dem _track_sudo_use-Hook in
# .bashrc, weil sudo selbst keine "verbleibende Sekunden"-Abfrage anbietet;
# falls Marker fehlt/abgelaufen aber sudo trotzdem warm meldet (z.B. weil
# der echte timestamp_timeout von den angenommenen 15 min abweicht), wird
# nur der Symbol ohne Minutenangabe gezeigt statt falscher Zahlen.
[custom.sudo_cache]
description = "sudo-Timestamp-Cache warm? (ground truth via sudo -Nnv) inkl. geschätzter Restzeit"
command = '''
f="${_SUDO_CACHE_FILE:-$HOME/.cache/sudo-last-used}"
mt=$(stat -c %Y "$f" 2>/dev/null) || exit 0
remaining=$(( 900 - ($(date +%s) - mt) ))
[ "$remaining" -le 0 ] && exit 0
echo "$(( (remaining + 59) / 60 ))m"
'''
when = "sudo -Nnv"
symbol = "🔓"
format = "[$symbol $output]($style) "
style = "bold fg:red"
shell = ["bash", "--noprofile", "--norc"]

[custom.ssh_no_keys]
description = "SSH missing keys"
when = "ssh-add -l | grep -q 'no identities'"
command = "echo 🚫"
format = "$symbol[$output]($style) "
shell = ["bash", "--noprofile", "--norc"]
symbol = "󱕵 "
style = "bold fg:red"

[custom.ssh_keys]
description = "SSH key count"
when = "ssh-add -l | grep -v -q 'no identities'"
command = "ssh-add -l | grep -v 'no identities' | wc -l"
format = "$symbol[$output]($style) "
shell = ["bash", "--noprofile", "--norc"]
symbol = "󱕵 "
style = "bold fg:green"

# Zeigt die Anzahl offener eingehender SSH-TCP-Verbindungen (sport=22, andere
# verbinden sich zu diesem Host) - nur sichtbar wenn mindestens 1 offen ist.
# Beruhigt: bei einer normalen Session (z.B. via Termius vom iPhone) sollte
# hier "1" stehen; mehr ist ein Hinweis auf zusätzliche/unerwartete
# Verbindungen. Steht bewusst vor der tmux-Anzeige (custom.tmux_session /
# custom.tmux_server_info).
[custom.ssh_in]
description = "Anzahl offener eingehender SSH-Verbindungen"
command = '''
ss -tn state established '( sport = :22 )' 2>/dev/null | tail -n +2 | wc -l
'''
when = '''
n=$(ss -tn state established '( sport = :22 )' 2>/dev/null | tail -n +2 | wc -l)
[ "$n" -ge 1 ]
'''
symbol = "↓"
format = "[$symbol $output]($style) "
style = "bold fg:yellow"
shell = ["bash", "--noprofile", "--norc"]

# Zeigt die Anzahl offener ausgehender SSH-TCP-Verbindungen (dport=22, dieser
# Host verbindet sich woanders hin) - nur sichtbar wenn mindestens 1 offen ist.
[custom.ssh_out]
description = "Anzahl offener ausgehender SSH-Verbindungen"
command = '''
ss -tn state established '( dport = :22 )' 2>/dev/null | tail -n +2 | wc -l
'''
when = '''
n=$(ss -tn state established '( dport = :22 )' 2>/dev/null | tail -n +2 | wc -l)
[ "$n" -ge 1 ]
'''
symbol = "↑"
format = "[$symbol $output]($style) "
style = "bold fg:blue"
shell = ["bash", "--noprofile", "--norc"]

# Mosh läuft nach dem initialen SSH-Handshake über UDP weiter (kein TCP:22
# mehr) und würde von custom.ssh_in/custom.ssh_out NICHT erfasst. Zählt
# stattdessen die laufenden mosh-server-Prozesse (= eingehende Sitzungen,
# jemand verbindet sich per Mosh zu diesem Host). Halbpfeil ⇣ statt ↓, um
# optisch von SSH zu unterscheiden - gleiches Farbschema (gelb=ein).
[custom.mosh_in]
description = "Anzahl laufender eingehender Mosh-Sitzungen"
command = '''
n=$(pgrep -c mosh-server 2>/dev/null)
echo "${n:-0}"
'''
when = '''
n=$(pgrep -c mosh-server 2>/dev/null)
[ "${n:-0}" -ge 1 ]
'''
symbol = "⇣"
format = "[$symbol $output]($style) "
style = "bold fg:yellow"
shell = ["bash", "--noprofile", "--norc"]

# Gegenstück zu custom.mosh_in: zählt laufende mosh-client-Prozesse (dieser
# Host hat per Mosh eine ausgehende Sitzung zu einem anderen Host offen).
[custom.mosh_out]
description = "Anzahl laufender ausgehender Mosh-Sitzungen"
command = '''
n=$(pgrep -c mosh-client 2>/dev/null)
echo "${n:-0}"
'''
when = '''
n=$(pgrep -c mosh-client 2>/dev/null)
[ "${n:-0}" -ge 1 ]
'''
symbol = "⇡"
format = "[$symbol $output]($style) "
style = "bold fg:blue"
shell = ["bash", "--noprofile", "--norc"]

# Custom module to show tmux session in prompt
[custom.tmux_session]
command = "tmux display-message -p '#S' 2>/dev/null"
when = 'test -n "$TMUX"'
format = "[ $output](bold yellow) "
shell = ["bash", "--noprofile", "--norc"]

# Zeigt Server-Status, wenn NICHT attached: läuft ein tmux-Server, und wenn
# ja, wie viele Sessions/verbundene Clients gibt es. Nur relevant außerhalb
# von tmux (siehe custom.tmux_session für den attached-Fall).
[custom.tmux_server_info]
description = "tmux-Server-Status, wenn nicht attached"
command = '''
sessions=$(tmux list-sessions 2>/dev/null | wc -l)
clients=$(tmux list-clients 2>/dev/null | wc -l)
echo "${sessions}S ${clients}C"
'''
when = 'test -z "$TMUX" && tmux list-sessions >/dev/null 2>&1'
symbol = "tmux"
format = "[$symbol $output](dimmed yellow) "
shell = ["bash", "--noprofile", "--norc"]

# Shows "CHEZMOI" while inside a `chezmoi cd` subshell
[custom.chezmoi]
description = "Inside a chezmoi cd subshell"
command = "echo CHEZMOI"
when = 'test -n "$CHEZMOI"'
format = "[ $output]($style) "
shell = ["bash", "--noprofile", "--norc"]
style = "bold fg:magenta"

# ══════════════════════════════════════════════════════════════════
# SHELL-VERSCHACHTELUNG (subshells, sudo -s, chezmoi cd, ...)
# tmux-bereinigt: SSH/mosh + tmux ist der Normalfall (SHLVL=2) und bleibt
# stumm; nur wenn innerhalb von tmux zusätzlich genestet wird (>=3) oder
# außerhalb von tmux schon ab Level 2 genestet wird, wird angezeigt.
# Das eingebaute [shlvl]-Modul kann das nicht: threshold ist ein fixer
# TOML-Wert, keine dynamische Bedingung auf $TMUX. Daher custom-Modul.
# ══════════════════════════════════════════════════════════════════
[custom.shlvl]
description = "Shell nesting depth, tmux-bereinigt"
command = 'echo $SHLVL'
when = '''
if [ -n "$TMUX" ]; then
  [ "$SHLVL" -ge 3 ]
else
  [ "$SHLVL" -ge 2 ]
fi
'''
symbol = "⇊ "
style = "bold yellow"
format = "$symbol[$output]($style) "
shell = ["bash", "--noprofile", "--norc"]
